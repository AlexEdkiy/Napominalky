version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: reminders_app
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders

  nginx:
    image: nginx:1.25-alpine
    container_name: reminders_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs:ro
      # In production, mount real certs (e.g. Let's Encrypt):
      # - /etc/letsencrypt/live/yourdomain.com/fullchain.pem:/etc/nginx/certs/selfsigned.crt:ro
      # - /etc/letsencrypt/live/yourdomain.com/privkey.pem:/etc/nginx/certs/selfsigned.key:ro
    depends_on:
      - app
    networks:
      - reminders

  db:
    image: postgres:17-alpine
    container_name: reminders_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  redis:
    image: redis:7-alpine
    container_name: reminders_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: reminders_horizon
    restart: always
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  reminders:
    driver: bridge
