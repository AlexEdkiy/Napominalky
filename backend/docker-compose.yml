# Имя compose-проекта закреплено: каталог переименован project→backend,
# а тома project_postgres_data/project_redis_data и контейнеры принадлежат проекту 'project'.
name: project

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: reminders_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders

  nginx:
    image: nginx:1.25-alpine
    container_name: reminders_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - reminders

  db:
    image: postgres:17-alpine
    container_name: reminders_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reminders}
      POSTGRES_USER: ${DB_USERNAME:-reminders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No host port binding: db is only accessed within the compose network.
    # If you need direct host access, add: ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reminders} -d ${DB_DATABASE:-reminders}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: reminders_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --aclfile /run/redis-acl/users.acl
    volumes:
      - redis_data:/data
      - ${REDIS_ACL_DIR:?Set REDIS_ACL_DIR to the provisioned ACL directory}:/run/redis-acl:ro
    # No host port binding: redis is only accessed within the compose network.
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(cat /run/redis-acl/health.password)" redis-cli --user health --no-auth-warning ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: reminders_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders
    profiles:
      - horizon

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  reminders:
    driver: bridge
