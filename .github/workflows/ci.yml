name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: reminders_test
      DB_USERNAME: reminders
      DB_PASSWORD: secret
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reminders_test
          POSTGRES_USER: reminders
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reminders -d reminders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, zip
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare disposable test environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
      - name: Run backend tests
        run: php artisan test --compact

  clients:
    name: ${{ matrix.layer }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        layer: [mobile, web]
    defaults:
      run:
        working-directory: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.layer }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run mobile tests
        if: matrix.layer == 'mobile'
        run: npm test -- --ci --runInBand
      - name: Run web tests
        if: matrix.layer == 'web'
        run: npm test -- --maxWorkers=2
      - name: Build web for production path
        if: matrix.layer == 'web'
        env:
          VITE_API_URL: /napominalki
        run: npm run build -- --base=/napominalki/
