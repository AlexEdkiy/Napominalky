server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Offline fallback files have stable names and must update with each release.
    location ~ ^/(offline-worker\.js|offline-retry\.js|connection\.css|connection-illustration\.png)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
