version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: reminders_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders

  nginx:
    image: nginx:1.25-alpine
    container_name: reminders_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - reminders

  db:
    image: postgres:17-alpine
    container_name: reminders_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reminders}
      POSTGRES_USER: ${DB_USERNAME:-reminders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reminders} -d ${DB_DATABASE:-reminders}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  redis:
    image: redis:7-alpine
    container_name: reminders_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reminders

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: reminders_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminders
    profiles:
      - horizon

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  reminders:
    driver: bridge
