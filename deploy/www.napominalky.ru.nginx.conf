# Insert inside the external proxy's http{} after certificates are ready.
upstream napominalky_landing { server napominalky_landing:8080; }

server {
    listen 80;
    server_name napominalky.ru www.napominalky.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.napominalky.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napominalky.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    location / { return 301 https://www.napominalky.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napominalky.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location / { proxy_pass http://napominalky_landing; }
}
