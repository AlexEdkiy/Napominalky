# ============================================================================
# ФАКТИЧЕСКАЯ интеграция «Напоминалок» в jemsoft.ru (развёрнуто).
#
# jemsoft.ru обслуживается НЕ системным nginx, а docker-контейнерами:
#   nginx-proxy   (80/443, TLS certbot)  конфиг: ~/.openclaw/workspace/insure-platform/nginx.conf
#   jemsoft-landing (:8080)              файлы:  ~/.openclaw/workspace/jemsoft-landing/
# Все контейнеры в сети docker `insure-platform_default`, restart=unless-stopped.
#
# Добавлено в insure-platform/nginx.conf:
#   upstream reminders_web { server reminders_web:8080; }   # nginx:alpine, отдаёт web/dist
#   upstream reminders_api { server reminders_serve:8000; } # Laravel (php artisan serve)
#
# В server{} HTTPS (jemsoft.ru):
#   location = /napominalki      { return 301 /napominalki/; }
#   location /napominalki/api/    { proxy_pass http://reminders_api/api/; }
#   location /napominalki/        { proxy_pass http://reminders_web; }
#
# reminders_web:    docker run -d nginx:alpine, том web/dist -> /usr/share/nginx/html/napominalki,
#                   конфиг deploy/reminders-web.nginx.conf (SPA fallback на /napominalki/index.html)
# reminders_serve:  project-app, php artisan serve --host=0.0.0.0:8000, APP_ENV=production APP_DEBUG=false,
#                   сети project_reminders + insure-platform_default
#
# Обновление SPA после пересборки web:  VITE_API_URL=/napominalki npx vite build --base=/napominalki/
#   затем  docker exec reminders_web nginx -s reload  (том ro подхватит новые файлы автоматически)
# ============================================================================
