# Insert inside the existing http{}; upstream reminders_web/reminders_api already exist.
# Install the HTTPS server only after issuing its certificate with webroot ACME.
server {
    listen 80;
    server_name lk.napominalky.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://lk.napominalky.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name lk.napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/lk.napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.napominalky.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /api/ { proxy_pass http://reminders_api; }
    location = /up { proxy_pass http://reminders_api; }
    location = /napominalki { return 301 https://lk.napominalky.ru/$is_args$args; }
    location /napominalki/ { rewrite ^/napominalki/(.*)$ /$1 permanent; }
    location / { proxy_pass http://reminders_web; }
}
