name: napominalky-landing
services:
  web:
    # The OPS-18 archive preserves the local image ID, not repository references.
    image: sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    pull_policy: never
    container_name: napominalky_landing
    restart: unless-stopped
    read_only: true
    entrypoint: [nginx, -g, "daemon off;"]
    labels:
      napominalky.managed: landing
      napominalky.release: ${LANDING_RELEASE_ID:?Specify LANDING_RELEASE_ID}
    ports:
      - 127.0.0.1:18089:8080
    volumes:
      - type: bind
        source: ${LANDING_RELEASE_DIR:?Specify immutable LANDING_RELEASE_DIR}/public
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LANDING_RELEASE_DIR:?Specify immutable LANDING_RELEASE_DIR}/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/cache/nginx:rw,size=16m
      - /var/run:rw,size=4m
      - /tmp:rw,noexec,nosuid,size=8m
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: napominalky_frontend
