events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        expires -1;

        # No landing content has been supplied yet. Do not index an empty site.
        location = / { try_files /index.html @unpublished; }
        location @unpublished {
            default_type text/plain;
            charset utf-8;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Retry-After 3600 always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 "Сайт готовится к запуску.\n";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
