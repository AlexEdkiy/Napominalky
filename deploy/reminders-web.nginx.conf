events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Security-заголовки (закрывают предупреждения сканеров/антивирусов о
        # «незащищённой» login-странице: clickjacking, MIME-sniffing, SSL-strip,
        # вторая линия против XSS). SPA самодостаточен (внешних ресурсов нет),
        # поэтому CSP строгий; style-src 'unsafe-inline' — из-за инлайн-стилей Vue.
        # HSTS без includeSubDomains: домен jemsoft.ru общий с другими сервисами.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # img-src включает blob: — клиентский ресайз/превью аватара грузит выбранный
        # файл через URL.createObjectURL() (blob:) перед отправкой; без blob: браузер
        # блокирует загрузку картинки («Не удалось прочитать изображение»).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # SPA «Напоминалки» (Vue: ЛК + админка), собрано с base=/napominalki/
        location /napominalki/ {
            try_files $uri $uri/ /napominalki/index.html;
        }

        location = / { return 404; }
    }
}
