# OPS-18: first stage, before TLS certificates and data are installed.
server {
    listen 195.206.252.160:80;
    server_name lk.napominalky.ru napominalky.ru www.napominalky.ru jemsoft.ru www.jemsoft.ru;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/napominalky-acme;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503;
    }
}
