# OPS-18: additive host-nginx configuration. Other panel-managed sites are unchanged.
server {
    listen 195.206.252.160:80;
    server_name lk.napominalky.ru napominalky.ru www.napominalky.ru jemsoft.ru www.jemsoft.ru;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/napominalky-acme;
        try_files $uri @ops18_old_acme;
    }
    # Keep source certificate renewal alive while non-Napominalky jemsoft paths
    # still use the old origin. Source rejects a second fallback to prevent loops.
    location @ops18_old_acme {
        proxy_pass http://94.103.15.24;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 195.206.252.160:443 ssl;
    server_name lk.napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/lk.napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.napominalky.ru/privkey.pem;
    server_tokens off;
    # Host panel currently ships 1.30.6. Avoid enabling HTTP/2 for these vhosts
    # until its patched package is confirmed; the application web image is 1.30.7.
    http2 off;
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        if (-f /srv/napominalky/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18000;
    }
    location = /up { proxy_pass http://127.0.0.1:18000; }
    location = /napominalki { return 301 https://lk.napominalky.ru/$is_args$args; }
    location /napominalki/ { rewrite ^/napominalki/(.*)$ /$1 permanent; }
    location / {
        if (-f /srv/napominalky/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18082;
    }
}

server {
    listen 195.206.252.160:443 ssl;
    server_name napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napominalky.ru/privkey.pem;
    server_tokens off;
    http2 off;
    return 301 https://www.napominalky.ru$request_uri;
}

server {
    listen 195.206.252.160:443 ssl;
    server_name www.napominalky.ru;
    ssl_certificate /etc/letsencrypt/live/napominalky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/napominalky.ru/privkey.pem;
    server_tokens off;
    http2 off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location / { proxy_pass http://127.0.0.1:18089; }
}

server {
    listen 195.206.252.160:443 ssl;
    server_name jemsoft.ru www.jemsoft.ru;
    ssl_certificate /etc/letsencrypt/live/jemsoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jemsoft.ru/privkey.pem;
    server_tokens off;
    http2 off;
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location = /napominalki { return 301 /napominalki/; }
    location /napominalki/api/ {
        if (-f /srv/napominalky/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18000/api/;
    }
    location /napominalki/ {
        if (-f /srv/napominalky/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18082;
    }
    # Preserve the owner's decision to retire Insure Platform.
    location /sub { return 410; }
    location /api/ { return 410; }
    location /gateway/ { return 410; }
    location /_next/ { return 410; }
    # Existing landing/Mafin recovery routes remain on their current origin.
    location / {
        proxy_ssl_server_name on;
        proxy_ssl_name jemsoft.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_pass https://94.103.15.24;
    }
}
